name: Browser acceptance · desktop and 440x956

on:
  pull_request:
    paths: ['app.mjs', 'full-questionnaire-app.mjs', 'data/**', 'docs/translation-review/**', 'docs/original-question-translation-review/**', 'e2e/**', 'lib/**', 'public/**', 'scripts/**', 'src/**', 'astro.config.mjs', 'package*.json', 'playwright.config.mjs', '.github/workflows/browser-qa.yml']
  push:
    branches: [main]
    paths: ['app.mjs', 'full-questionnaire-app.mjs', 'data/**', 'docs/translation-review/**', 'docs/original-question-translation-review/**', 'e2e/**', 'lib/**', 'public/**', 'scripts/**', 'src/**', 'astro.config.mjs', 'package*.json', 'playwright.config.mjs', '.github/workflows/browser-qa.yml']

permissions:
  contents: read

concurrency:
  group: browser-acceptance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  browser:
    runs-on: ubuntu-24.04
    # Reuse the exact browser image qualified in repository browser CI.
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble@sha256:2f05f8a734509a7b3f26a912639488ee08f58a7b292d14d62271bcff9038768f
    timeout-minutes: 25
    env:
      COMMUNITY_DEPLOY_TARGET: github-pages
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Verify preinstalled browser revisions match the locked package
        run: |
          node -e "const fs=require('node:fs');const {chromium,webkit}=require('playwright');for(const b of [chromium,webkit])if(!fs.existsSync(b.executablePath()))throw Error('Missing locked browser: '+b.executablePath())"
      - run: npm run build
      - run: npm run test:browser

      - name: Upload exact candidate browser report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: community-browser-${{ github.event.pull_request.head.sha || github.sha }}
          path: playwright-report
          retention-days: 3
