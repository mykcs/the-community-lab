name: Browser acceptance · desktop and 440x956

on:
  pull_request:
    paths: ['app.mjs', 'full-questionnaire-app.mjs', 'data/**', 'e2e/**', 'lib/**', 'public/**', 'scripts/**', 'src/**', 'astro.config.mjs', 'package*.json', 'playwright.config.mjs', '.github/workflows/browser-qa.yml']
  push:
    branches: [main]
    paths: ['app.mjs', 'full-questionnaire-app.mjs', 'data/**', 'e2e/**', 'lib/**', 'public/**', 'scripts/**', 'src/**', 'astro.config.mjs', 'package*.json', 'playwright.config.mjs', '.github/workflows/browser-qa.yml']

permissions:
  contents: read

concurrency:
  group: browser-acceptance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      COMMUNITY_DEPLOY_TARGET: github-pages
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps --only-shell chromium
      - run: npm run build
      - run: npm run test:browser
