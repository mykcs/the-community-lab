name: Verify Astro bilingual demo
on:
  pull_request:
    paths: ['app.mjs', 'full-questionnaire-app.mjs', 'api/**', 'supabase/**', 'data/**', 'lib/**', 'tests/**', 'scripts/**', 'src/**', 'astro.config.mjs', 'tsconfig.json', 'package*.json', 'docs/VERIFICATION-MATRIX.md', '.github/workflows/verify.yml', '.github/workflows/pages.yml']
  push:
    branches: [main]
    paths: ['app.mjs', 'full-questionnaire-app.mjs', 'api/**', 'supabase/**', 'data/**', 'lib/**', 'tests/**', 'scripts/**', 'src/**', 'astro.config.mjs', 'tsconfig.json', 'package*.json', 'docs/VERIFICATION-MATRIX.md', '.github/workflows/verify.yml', '.github/workflows/pages.yml']
permissions:
  contents: read
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - name: Set up Deno for the optional Supabase Edge Function candidate
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.5.6
      - name: Type-check the Supabase function without deploying
        run: deno check --config supabase/functions/account-delete/deno.json supabase/functions/account-delete/index.ts
