name: Validate translation review draft

on:
  pull_request:
    paths:
      - 'docs/translation-review/**'
      - 'tests/translation-review-page.test.mjs'
      - '.github/workflows/github-pages-translation-review.yml'
  push:
    branches: [main]
    paths:
      - 'docs/translation-review/**'
      - 'tests/translation-review-page.test.mjs'
      - '.github/workflows/github-pages-translation-review.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: translation-review-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: node --test tests/translation-review-page.test.mjs
