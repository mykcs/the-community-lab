name: Publish GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/pages.yml'
      - 'astro.config.mjs'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig.json'
      - 'src/**'
      - 'public/**'
      - 'app.mjs'
      - 'full-questionnaire-app.mjs'
      - 'data/**'
      - 'lib/**'
      # Build-time modules imported by src/pages/questionnaire/index.astro.
      # Research-only probes and tests still run in PR/main verification CI,
      # but do not change the public static artifact.
      - 'scripts/stage-review-pages.mjs'
      - 'scripts/deploy-target.mjs'
      - 'scripts/load-full-questionnaire.mjs'
      - 'scripts/verify-korean-source-snapshot.mjs'
      - 'scripts/verify-client-display-order.mjs'
      - 'docs/translation-review/**'
      - 'docs/original-question-translation-review/**'
  workflow_dispatch:

permissions:
  contents: read

# Set this repository variable only after GitHub Pages has the same custom
# domain configured. An empty value keeps the existing project-site URL.
env:
  COMMUNITY_PAGES_DOMAIN: ${{ vars.COMMUNITY_PAGES_DOMAIN }}

concurrency:
  group: github-pages-production
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      COMMUNITY_DEPLOY_TARGET: github-pages
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - name: Verify project-path navigation and private-history candidate is static-safe
        run: node scripts/verify-pages-history.mjs
      # The shared npm build also stages both unreviewed review routes.
      # Local preview/browser CI and the deployed artifact must be identical.
      # This public release marker is never a survey answer or credential.
      - name: Stamp build commit for exact-release verification
        run: printf '%s\n' "$GITHUB_SHA" > dist/release-commit.txt
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish verified static artifact
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
      # A successful deployment API response alone does not prove what the
      # public Pages URL actually serves. Check the exact HEAD and each entry.
      # No production answers are submitted, and Vercel is not involved.
      - name: Verify live Pages release and required public routes
        shell: bash
        env:
          PAGES_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          set -euo pipefail
          base="${PAGES_URL%/}"
          expected_base="$(node --input-type=module -e 'import { getPagesDeploymentConfig } from "./lib/pages-deployment-config.mjs"; console.log(getPagesDeploymentConfig(process.env).publicUrl)')"
          if [[ -z "$base" || "$base" != "$expected_base" ]]; then
            echo "Unexpected Pages release URL; refusing unverified target" >&2
            exit 1
          fi
          confirmed=0
          for attempt in {1..12}; do
            # Propagation may briefly leave the previous release on the CDN.
            live_sha="$(curl -fsSL --connect-timeout 5 --max-time 12 "$base/release-commit.txt" || true)"
            if [[ "$live_sha" == "$GITHUB_SHA" ]]; then
              confirmed=1
              break
            fi
            if [[ $attempt -lt 12 ]]; then sleep 5; fi
          done
          if [[ "$confirmed" != 1 ]]; then
            echo "Live Pages did not expose this run's commit SHA" >&2
            exit 1
          fi
          curl -fsSL --max-time 15 "$base/" > /tmp/community-pages-home.html
          curl -fsSL --max-time 15 "$base/questionnaire/" > /tmp/community-pages-questionnaire.html
          curl -fsSL --max-time 15 "$base/translation-review/" > /tmp/community-pages-review.html
          curl -fsSL --max-time 15 "$base/original-question-translation-review/" > /tmp/community-pages-original-review.html
          grep -Fq 'THE COMMUNITY' /tmp/community-pages-home.html
          grep -Fq 'id="full-questionnaire-data"' /tmp/community-pages-questionnaire.html
          grep -Fq 'id="embedded-data"' /tmp/community-pages-review.html
          grep -Fq 'aria-label="筛选季别"' /tmp/community-pages-original-review.html
          echo "Verified exact production commit and 4 public routes; browser/translation/scoring parity require separate evidence."
