name: Publish GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/pages.yml'
      - 'astro.config.mjs'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig.json'
      - 'src/**'
      - 'public/**'
      - 'app.mjs'
      - 'full-questionnaire-app.mjs'
      - 'data/**'
      - 'lib/**'
      - 'scripts/**'
      - 'tests/**'
      - 'docs/translation-review/**'
      - 'docs/original-question-translation-review/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages-production
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      COMMUNITY_DEPLOY_TARGET: github-pages
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - name: Verify project-path navigation and private-history candidate is static-safe
        run: node scripts/verify-pages-history.mjs
      - name: Include the unreviewed bilingual translation draft on a separate route
        run: |
          mkdir -p dist/translation-review
          cp docs/translation-review/index.html dist/translation-review/index.html
      - name: Publish the standalone original-question review page
        run: |
          mkdir -p dist/original-question-translation-review
          cp docs/original-question-translation-review/index.html dist/original-question-translation-review/index.html
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish verified static artifact
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
